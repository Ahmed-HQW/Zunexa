<!DOCTYPE html>
<!--
  ╔══════════════════════════════════════════════════════════════════╗
  ║  ZUNEXA — ARCHON AI · Shared Chat Viewer                        ║
  ║  Public, read-only. No login required — this page intentionally ║
  ║  does NOT include the auth guard that ai.html has, because a    ║
  ║  shared link must be openable by anyone who receives it.        ║
  ║  Reads only from the public `shared_chats` table (a snapshot —  ║
  ║  see ZUNEXA_DB_SETUP_SHARED_CHATS.sql) — never private tables.  ║
  ╚══════════════════════════════════════════════════════════════════╝
-->
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<meta name="theme-color" content="#060606">
<title>محادثة مشارَكة · Archon AI</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700&family=Rajdhani:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root {
  --void:#060606; --deep:#090909; --card:#0e0e0e; --card2:#121212;
  --b1:#1a1a1a; --b2:#242424;
  --gold:#D4AF37; --gdim:#7a6218;
  --tw:#edeae2; --tg:#7a7468; --tm:#303028;
  --r2:11px; --r3:17px;
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{
  font-family:'Rajdhani',sans-serif;background:var(--void);color:var(--tw);
  min-height:100vh;display:flex;flex-direction:column;align-items:center;
  padding:28px 16px 60px;
}
.top{
  width:100%;max-width:720px;display:flex;align-items:center;gap:10px;
  margin-bottom:22px;
}
.mark{
  width:36px;height:36px;border-radius:9px;flex-shrink:0;
  background:linear-gradient(135deg,var(--gold),var(--gdim));
  display:grid;place-items:center;font-family:'Cinzel',serif;
  font-weight:700;color:#060606;
}
.brand{font-family:'Cinzel',serif;font-size:13px;letter-spacing:.06em;color:var(--gold)}
.brand small{display:block;font-family:'Rajdhani',sans-serif;color:var(--tg);font-size:10.5px;letter-spacing:.1em;margin-top:1px}
.cta{
  margin-right:auto;padding:8px 16px;border-radius:99px;
  background:linear-gradient(135deg,var(--gold),var(--gdim));
  color:#060606;font-weight:700;font-size:12px;text-decoration:none;
}
.title{
  width:100%;max-width:720px;font-size:15px;color:var(--tg);
  margin-bottom:18px;padding-bottom:14px;border-bottom:1px solid var(--b1);
}
.thread{width:100%;max-width:720px;display:flex;flex-direction:column;gap:14px}
.msg{display:flex;gap:10px}
.msg.user{flex-direction:row-reverse}
.av{
  width:30px;height:30px;border-radius:8px;flex-shrink:0;
  display:grid;place-items:center;font-size:11px;font-weight:700;
}
.msg.bot .av{background:linear-gradient(135deg,var(--gold),var(--gdim));color:#060606;font-family:'Cinzel',serif}
.msg.user .av{background:var(--card);border:1px solid var(--b1);color:var(--tg)}
.bubble{
  max-width:78%;padding:11px 14px;border-radius:12px;font-size:14px;line-height:1.75;
}
.msg.bot .bubble{background:var(--card2);border:1px solid var(--b1)}
.msg.user .bubble{background:rgba(212,175,55,.08);border:1px solid rgba(212,175,55,.18)}
.state{color:var(--tg);font-size:13px;text-align:center;padding:60px 0}
.foot{margin-top:30px;font-size:11px;color:var(--tm);text-align:center}
</style>
</head>
<body>

<div class="top">
  <div class="mark">Z</div>
  <div class="brand">ZUNEXA<small>ARCHON AI · محادثة مشارَكة</small></div>
  <a class="cta" href="ai.html">جرّب Archon ✦</a>
</div>

<div class="title" id="chatTitle">جاري التحميل...</div>
<div class="thread" id="thread"></div>
<div class="foot">هاد الرابط للقراءة فقط — لقطة من المحادثة وقت المشاركة، ماشي محادثة حية.</div>

<script>
const _SB = supabase.createClient(
  'https://xrldhfsytysznyyhwjlr.supabase.co',
  'sb_publishable_qtZyzLSPVYjH0yB0BJY8yg_2r2ct35F'
);

function esc(s) {
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}
function fmt(text) {
  return esc(text)
    .replace(/\*\*(.*?)\*\*/g,'<strong>$1</strong>')
    .replace(/`([^`]+)`/g,'<code>$1</code>')
    .replace(/\n/g,'<br>');
}

async function loadShare() {
  const params = new URLSearchParams(location.search);
  const id = params.get('id');
  const threadEl = document.getElementById('thread');
  const titleEl  = document.getElementById('chatTitle');

  if (!id) {
    titleEl.textContent = '';
    threadEl.innerHTML = '<div class="state">⚠ رابط غير صالح — ناقصو معرّف المشاركة.</div>';
    return;
  }

  try {
    const { data, error } = await _SB
      .from('shared_chats')
      .select('title, messages, created_at')
      .eq('share_id', id)
      .maybeSingle();

    if (error) throw error;
    if (!data) {
      titleEl.textContent = '';
      threadEl.innerHTML = '<div class="state">⚠ هاد المحادثة ما كايناش — الرابط خاطئ ولا تم حذفها.</div>';
      return;
    }

    titleEl.textContent = data.title || 'محادثة Archon AI';
    const msgs = Array.isArray(data.messages) ? data.messages : [];
    if (!msgs.length) {
      threadEl.innerHTML = '<div class="state">هاد المحادثة فارغة.</div>';
      return;
    }

    threadEl.innerHTML = msgs.map(m => `
      <div class="msg ${m.role === 'user' ? 'user' : 'bot'}">
        <div class="av">${m.role === 'user' ? '◉' : 'Z'}</div>
        <div class="bubble">${fmt(m.text || '')}</div>
      </div>
    `).join('');
  } catch (e) {
    console.error(e);
    titleEl.textContent = '';
    threadEl.innerHTML = '<div class="state">⚠ تعذّر تحميل المحادثة — حاول بعد قليل.</div>';
  }
}

loadShare();
</script>
</body>
</html>
