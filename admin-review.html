<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<title>Zunexa — مراجعة المعرفة المُتعلَّمة تلقائياً</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>
  :root { --bg:#0b0b10; --card:#16161f; --border:#2a2a38; --gold:#d4af37; --text:#eee; --tg:#999; --danger:#e05555; --ok:#4caf50; }
  * { box-sizing:border-box; }
  body { background:var(--bg); color:var(--text); font-family:system-ui,sans-serif; margin:0; padding:24px; }
  h1 { color:var(--gold); font-size:20px; margin-bottom:4px; }
  p.sub { color:var(--tg); font-size:13px; margin-top:0; margin-bottom:24px; }
  .row { background:var(--card); border:1px solid var(--border); border-radius:10px; padding:16px; margin-bottom:14px; }
  .q { font-weight:600; margin-bottom:6px; }
  .a { white-space:pre-wrap; color:#ddd; font-size:14px; line-height:1.6; border:1px solid var(--border); border-radius:8px; padding:10px; margin-bottom:10px; background:#101018; }
  .meta { font-size:11px; color:var(--tg); margin-bottom:10px; }
  textarea.edit { width:100%; min-height:100px; background:#101018; color:#ddd; border:1px solid var(--border); border-radius:8px; padding:8px; font-family:inherit; font-size:13px; margin-bottom:8px; }
  .actions button { border:none; border-radius:6px; padding:8px 14px; margin-inline-end:8px; cursor:pointer; font-size:13px; font-weight:600; }
  .approve { background:var(--ok); color:#fff; }
  .reject  { background:var(--danger); color:#fff; }
  .save    { background:var(--gold); color:#111; }
  .empty { color:var(--tg); text-align:center; padding:60px 0; }
  #authGate { max-width:420px; margin:80px auto; text-align:center; }
  #authGate input { width:100%; padding:10px; margin:8px 0; border-radius:6px; border:1px solid var(--border); background:#101018; color:#eee; }
  #authGate button { width:100%; padding:10px; border:none; border-radius:6px; background:var(--gold); color:#111; font-weight:600; cursor:pointer; }
</style>
</head>
<body>

<div id="authGate">
  <h1>تسجيل الدخول (مطلوب حساب مسؤول)</h1>
  <p class="sub">هذه الصفحة تستعمل جلسة Supabase Auth الحقيقية — نفس المصادقة المذكورة في تعليق الأمان بـ ai.html، وليست device_id.</p>
  <input id="email" type="email" placeholder="البريد الإلكتروني">
  <input id="password" type="password" placeholder="كلمة المرور">
  <button onclick="doLogin()">دخول</button>
  <p id="authMsg" style="color:var(--danger);font-size:12px;"></p>
</div>

<div id="panel" style="display:none">
  <h1>⚡ مراجعة المعرفة المُتعلَّمة تلقائياً</h1>
  <p class="sub">...</p>
  
  <!-- زر قبول الكل -->
  <div style="margin-bottom: 20px;">
    <button class="approve" onclick="approveAll()" style="padding: 10px 18px; font-size: 14px;">
      ✓ قبول كل المدخلات المعروضة بضغطة واحدة
    </button>
  </div>

  <div id="list"></div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const _SB = supabase.createClient(
  'https://xrldhfsytysznyyhwjlr.supabase.co',
  'sb_publishable_qtZyzLSPVYjH0yB0BJY8yg_2r2ct35F'
);

async function doLogin() {
  const email = document.getElementById('email').value.trim();
  const password = document.getElementById('password').value;
  const { error } = await _SB.auth.signInWithPassword({ email, password });
  if (error) { document.getElementById('authMsg').textContent = 'فشل الدخول: ' + error.message; return; }
  await checkSession();
}

async function checkSession() {
  const { data: { session } } = await _SB.auth.getSession();
  if (session) {
    document.getElementById('authGate').style.display = 'none';
    document.getElementById('panel').style.display = 'block';
    loadPending();
  }
}

async function loadPending() {
  const list = document.getElementById('list');
  list.innerHTML = '<p class="empty">جاري التحميل...</p>';
  
  // درنا حد ديال 1000 باش المتصفح مايتبلوقاش إذا كانو المدخلات بالآلاف
  const { data, error } = await _SB
    .from('ai_knowledge')
    .select('id,question,answer,keywords,category,weight,created_at,origin_model,review_status')
    .eq('review_status', 'pending_review')
    .order('created_at', { ascending: false })
    .limit(2000); 

  if (error) {
    list.innerHTML = `<p class="empty" style="color:var(--danger);">تعذّر التحميل: ${error.message}</p>`;
    return;
  }
  
  if (!data || !data.length) {
    // عوض رسالة طويلة، غنديرو غير أيقونة أو نص خفيف بزاف باش تعرف بلي الكود خدام وماكاين والو
    list.innerHTML = '<div style="opacity: 0.3; text-align: center; margin-top: 40px; font-size: 12px;">(0)</div>';
    return;
  }
  
  list.innerHTML = '';
  data.forEach(row => list.appendChild(renderRow(row)));
}

function renderRow(row) {
  const div = document.createElement('div');
  div.className = 'row';
  div.innerHTML = `
    <div class="q">${escapeHtml(row.question)}</div>
    <div class="a" contenteditable="true" id="ans-${row.id}">${escapeHtml(row.answer)}</div>
    <div class="meta">
      id: ${row.id} · category: ${row.category || 'general'} · origin_model: ${row.origin_model || '—'} ·
      ${row.created_at ? new Date(row.created_at).toLocaleString('ar') : ''}
    </div>
    <div class="actions">
      <button class="approve" onclick="approve(${row.id})">✓ قبول</button>
      <button class="reject" onclick="reject(${row.id})">✕ رفض (حذف)</button>
      <button class="save" onclick="saveEdit(${row.id})">💾 حفظ التعديل بدون تفعيل</button>
    </div>
  `;
  return div;
}

function escapeHtml(s) {
  return (s || '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

async function approve(id) {
  const editedAnswer = document.getElementById('ans-' + id).innerText;
  const { error } = await _SB.from('ai_knowledge').update({
    is_active: true,
    review_status: 'approved',
    answer: editedAnswer,
    weight: 1.0, // approved by a human — treat on par with curated entries
  }).eq('id', id);
  if (error) { alert('خطأ: ' + error.message); return; }
  loadPending();
}

async function reject(id) {
  if (!confirm('حذف هذا المدخل نهائياً؟')) return;
  const { error } = await _SB.from('ai_knowledge').delete().eq('id', id);
  if (error) { alert('خطأ: ' + error.message); return; }
  loadPending();
}

async function saveEdit(id) {
  const editedAnswer = document.getElementById('ans-' + id).innerText;
  const { error } = await _SB.from('ai_knowledge').update({ answer: editedAnswer }).eq('id', id);
  if (error) { alert('خطأ: ' + error.message); return; }
  alert('تم الحفظ (لازال غير مفعّل، اضغط قبول للتفعيل).');
}

async function approveAll() {
  if (!confirm('هل أنت متأكد من قبول وتفعيل جميع المدخلات بانتظار المراجعة؟')) return;

  const list = document.getElementById('list');
  list.innerHTML = '<p class="empty">جاري قبول وتفعيل جميع العناصر...</p>';

  // تحديث جميع الصفوف التي تنتظر المراجعة مرة واحدة
  const { error } = await _SB
    .from('ai_knowledge')
    .update({
      is_active: true,
      review_status: 'approved',
      weight: 1.0
    })
    .eq('review_status', 'pending_review');

  if (error) {
    alert('حدث خطأ أثناء التحديث: ' + error.message);
    loadPending(); // إعادة تحميل القائمة
    return;
  }

  alert('تم قبول وتفعيل جميع المدخلات بنجاح! 🎉');
  loadPending(); // إعادة تحديث الصفحات لتظهر فارغة
}
checkSession();
</script>
</body>
</html>
