<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<title>لوحة التحكم بمحرك المعرفة - Archon AI</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>
  :root { 
    --bg:#0b0b10; 
    --card:#16161f; 
    --border:#2a2a38; 
    --gold:#d4af37; 
    --text:#eee; 
    --tg:#999; 
    --ok:#4caf50; 
    --danger:#e05555; 
    --warning:#ff9800;
  }
  * { box-sizing:border-box; }
  body { background:var(--bg); color:var(--text); font-family:system-ui,sans-serif; margin:0; padding:24px; display: flex; justify-content: center; }
  .container { background:var(--card); border:1px solid var(--border); border-radius:12px; padding:24px; width: 100%; max-width: 720px; margin-top: 10px; box-shadow: 0 8px 24px rgba(0,0,0,0.5); }
  h1 { color:var(--gold); font-size:20px; margin-bottom:6px; text-align: center; }
  p.sub { color:var(--tg); font-size:12px; text-align: center; margin-bottom:20px; line-height: 1.6; }
  
  /* Control Panel & Buttons */
  .control-panel { display: flex; gap: 10px; justify-content: center; margin-bottom: 20px; flex-wrap: wrap; }
  button { background: #1f1f2e; border: 1px solid var(--border); color: #fff; padding: 10px 18px; border-radius: 8px; cursor: pointer; font-weight: bold; font-size: 13px; transition: all 0.2s ease; }
  button:hover { background: var(--border); }
  button.btn-start { background: #1b5e20; border-color: var(--ok); color: #fff; }
  button.btn-start:hover { background: #2e7d32; }
  button.btn-pause { background: #e65100; border-color: var(--warning); color: #fff; }
  button.btn-pause:hover { background: #f57c00; }
  
  /* Settings Bar */
  .settings-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 20px; background: #101018; padding: 12px; border-radius: 8px; border: 1px solid var(--border); }
  .setting-item label { display: block; font-size: 11px; color: var(--tg); margin-bottom: 4px; text-align: right; }
  .setting-item input { width: 100%; background: #16161f; color: var(--gold); border: 1px solid var(--border); padding: 6px; border-radius: 6px; text-align: center; font-weight: bold; }

  label { display: block; margin-bottom: 6px; font-size: 13px; font-weight: 600; color: var(--gold); }
  input, textarea { width:100%; background:#101018; color:#ddd; border:1px solid var(--border); border-radius:8px; padding:10px; font-family:monospace; font-size:12px; margin-bottom:14px; direction: ltr; text-align: left; }
  textarea { min-height: 90px; resize: vertical; }
  .ar-text { font-family: system-ui, sans-serif; direction: rtl; text-align: right; }
  
  #statusBox { background: #101018; border: 1px solid var(--border); border-radius: 8px; padding: 12px; text-align: center; font-size: 13px; color: var(--gold); font-family: system-ui, sans-serif; font-weight: bold; }
  .stats { font-size: 12px; color: var(--tg); text-align: center; margin-top: 10px; font-family: system-ui, sans-serif; }
  .status-badge { display: inline-block; padding: 3px 8px; border-radius: 12px; font-size: 11px; margin-right: 6px; }
  .badge-active { background: rgba(76, 175, 80, 0.2); color: var(--ok); border: 1px solid var(--ok); }
  .badge-paused { background: rgba(255, 152, 0, 0.2); color: var(--warning); border: 1px solid var(--warning); }
</style>
</head>
<body>

<div class="container">
  <h1>⚙️ لوحة التحكم في حقن البيانات - Archon AI</h1>
  <p class="sub">يمكنك التحكم في سرعة الإرسال أو إيقاف المحرك مؤقتاً لتخفيف الضغط على قاعدة بيانات Supabase.</p>

  <!-- أزرار التحكم -->
  <div class="control-panel">
    <button class="btn-start" onclick="startEngine()">▶️ تشغيل / استئناف</button>
    <button class="btn-pause" onclick="pauseEngine()">⏸️ إيقاف مؤقت (إراحة Supabase)</button>
    <button onclick="resetStats()">🔄 إعادة ضبط العداد</button>
  </div>

  <!-- خيارات التحكم في الضغط -->
  <div class="settings-grid">
    <div class="setting-item">
      <label class="ar-text">حجم الدفعة (عدد الطلبات في اللحظة):</label>
      <input type="number" id="batchSizeInput" value="30" min="1" max="50">
    </div>
    <div class="setting-item">
      <label class="ar-text">التأخير الزمني بين الدفعات (بالملي ثانية):</label>
      <input type="number" id="delayInput" value="500" min="100" step="100">
    </div>
  </div>

  <label class="ar-text">السؤال أو الطلب المولد مؤخراً:</label>
  <input type="text" id="qInput" class="ar-text" readonly placeholder="في انتظار التشغيل...">

  <label class="ar-text">القالب أو الكود البرمجي المولد مؤخراً:</label>
  <textarea id="aInput" readonly placeholder="في انتظار التشغيل..."></textarea>

  <label class="ar-text">التصنيف المعرفي / البرمجي:</label>
  <input type="text" id="catInput" readonly value="...">

  <div id="statusBox">
    الحالة: <span id="badge" class="status-badge badge-paused">🟡 متوقف مؤقتاً</span>
  </div>
  <div class="stats" id="counterStats">تم إرسال: 0 معلومة في هذه الجلسة</div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const _SB = supabase.createClient(
  'https://xrldhfsytysznyyhwjlr.supabase.co',
  'sb_publishable_qtZyzLSPVYjH0yB0BJY8yg_2r2ct35F'
);

const megaPool = [
  { q: "أهلاً، أنا مطور، ما هي أفضل طريقة للبدء في مشروع تقني جديد اليوم؟", a: "أهلاً بك! ابدأ بتحديد المتطلبات الأساسية، تقسيم المهام إلى أجزاء صغيرة، وااختيار التقنيات المناسبة.", cat: "personal_greeting" },
  { q: "لنتذكر معاً، نحن نعمل على مشروع باستخدام التقنيات الحديثة. ما هي الخطوة التالية؟", a: "الخطوة التالية هي مراجعة الكود الحالي (Code Review)، اختبار أداء قاعدة البيانات، وتحسين الواجهة.", cat: "context_reset" },
  { q: "أشعر بالتعب والملل في العمل على مشروعي التقني، أعطني كلمات تحفيزية سريعة.", a: "خذ استراحة قصيرة لمدة 5 دقائق، اشرب ماء، ثم عد لتبدأ بـ Pomodoro لمدة 25 دقيقة.", cat: "motivation" },
  { q: "اليوم يوم طويل وشاق، أريد محادثة خفيفة ومريحة لنأخذ استراحة من الأكواد.", a: "لا بأس يا صديقي، الاستراحة ضرورية لشحن الطاقة العقلية. خذ وقتاً للاسترخاء وسنعود أقوى.", cat: "check_in" },
  { q: "لدي مشكلة طارئة في النظام، أريد حلاً مباشراً ودقيقاً بدون تفاصيل طويلة.", a: "افحص سجلات الأخطاء (Logs) فوراً، حدد الخطوط البرمجية المسؤولة، وقم بتطبيق رقعة تصحيح سريعة.", cat: "sos_help" },
  { q: "رتب مهامي اليومية واضع لها جدولاً زمنياً منظماً.", a: "1. المهام الحرجة (صباحاً)\n2. البرمجة والتطوير (ظهراً)\n3. الاختبار ومراجعة الأخطاء (مساءً)", cat: "productivity" }
];

function inject200Templates() {
  const extraLangs = ['Python', 'JavaScript', 'C++', 'Java', 'PHP', 'Ruby', 'Swift', 'Go', 'Rust', 'Dart'];
  const extraTasks = [
    { t: 'عكس مصفوفة', code: 'arr.reverse()' },
    { t: 'فرز بيانات', code: 'data.sort()' },
    { t: 'طباعة الوقت الحالي', code: 'print(Time.now)' },
    { t: 'قراءة ملف نصي', code: 'readFile("data.txt")' },
    { t: 'تشفير كلمة مرور', code: 'hash(password)' }
  ];

  for (let i = 0; i < extraLangs.length; i++) {
    for (let j = 0; j < extraTasks.length; j++) {
      for (let k = 1; k <= 3; k++) {
        megaPool.push({
          q: `اكتب كود ${extraLangs[i]} سريع لـ ${extraTasks[j].t}`,
          a: `// لغة: ${extraLangs[i]}\n// المهمة: ${extraTasks[j].t}\nfunction task() {\n  return ${extraTasks[j].code};\n}`,
          cat: `${extraLangs[i].toLowerCase()}_code`
        });
      }
    }
  }
}
inject200Templates();

let currentIndex = 0;
let successCount = 0;
let isRunning = false;
let loopTimeout = null;

function makeUniqueInvisible(text, id) {
  let suffix = '';
  let n = id;
  do {
    suffix += (n % 2 === 0) ? '\u200B' : '\u200C';
    n = Math.floor(n / 2);
  } while (n > 0);
  return text + suffix;
}

function generateInfiniteItem(index) {
  const base = megaPool[index % megaPool.length];
  return {
    q: makeUniqueInvisible(base.q, index),
    a: base.a,
    cat: base.cat
  };
}

async function sendSingleItem() {
  const item = generateInfiniteItem(currentIndex);
  currentIndex++; 

  const { error } = await _SB
    .from('ai_knowledge')
    .upsert([
      {
        question: item.q,
        answer: item.a,
        category: item.cat,
        review_status: 'pending_review',
        is_active: false,
        origin_model: 'archon_ultimate_engine_300',
        weight: 0.99
      }
    ], { onConflict: 'question' });

  return { error, item };
}

async function runBatchCycle() {
  if (!isRunning) return;

  const statusBox = document.getElementById('statusBox');
  const statsBox = document.getElementById('counterStats');
  const batchSize = parseInt(document.getElementById('batchSizeInput').value) || 10;
  const delaySpeed = parseInt(document.getElementById('delayInput').value) || 1000;

  const promises = [];
  for (let i = 0; i < batchSize; i++) {
    promises.push(sendSingleItem());
  }

  const results = await Promise.all(promises);

  let batchSuccess = 0;
  let lastItem = null;

  results.forEach(res => {
    if (!res.error) {
      batchSuccess++;
      successCount++;
      lastItem = res.item;
    }
  });

  if (batchSuccess > 0) {
    statusBox.innerHTML = `الحالة: <span class="status-badge badge-active">🟢 يعمل الآن</span> (تم إرسال ${batchSuccess} عنصر بنجاح)`;
    statsBox.textContent = `الإجمالي المرسل: ${successCount} معلومة في هذه الجلسة`;
    
    if (lastItem) {
      document.getElementById('qInput').value = lastItem.q;
      document.getElementById('aInput').value = lastItem.a;
      document.getElementById('catInput').value = lastItem.cat;
    }
  } else {
    statusBox.innerHTML = `الحالة: <span style="color:var(--danger)">🔴 خطأ في الاتصال بالسيرفر!</span>`;
  }

  // جدولة الدفعة القادمة بناءً على السرعة المحددة
  if (isRunning) {
    loopTimeout = setTimeout(runBatchCycle, delaySpeed);
  }
}

function startEngine() {
  if (isRunning) return;
  isRunning = true;
  document.getElementById('statusBox').innerHTML = `الحالة: <span class="status-badge badge-active">🟢 جاري التشغيل...</span>`;
  runBatchCycle();
}

function pauseEngine() {
  isRunning = false;
  if (loopTimeout) clearTimeout(loopTimeout);
  document.getElementById('statusBox').innerHTML = `الحالة: <span class="status-badge badge-paused">🟡 متوقف مؤقتاً (Supabase مرتاح الآن)</span>`;
}

function resetStats() {
  successCount = 0;
  document.getElementById('counterStats').textContent = `تم إرسال: 0 معلومة في هذه الجلسة`;
}
</script>
</body>
</html>
