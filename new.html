  { q: "ما هي الحضارة التي بنَت الأهرامات في مصر؟", a: "حضارة المصريين القدماء (الفراعنة) هي من بنَت الأهرامات العريقة.", cat: "history" },
  { q: "متى سقطت غرناطة؟", a: "سقطت غرناطة آخر معاقل المسلمين في الأندلس عام 1492 ميلادية.", cat: "history" },

let currentIndex = 0;
let successCount = 0;

async function runAutoLoop() {
  const statusBox = document.getElementById('statusBox');
  const statsBox = document.getElementById('counterStats');
  
  const item = knowledgePool[currentIndex % knowledgePool.length];
  
  const finalQuestion = item.q;
  const finalAnswer = item.a;
  const finalCategory = item.cat || "general_mixed";

  document.getElementById('qInput').value = finalQuestion;
  document.getElementById('aInput').value = finalAnswer;
  document.getElementById('catInput').value = finalCategory;

  statusBox.style.color = 'var(--text)';
  statusBox.textContent = 'جاري إرسال المدخل المعرفي إلى قاعدة البيانات...';

  const { error } = await _SB
    .from('ai_knowledge')
    .upsert([
      {
        question: finalQuestion,
        answer: finalAnswer,
        category: finalCategory,
        review_status: 'pending_review',
        is_active: false,
        origin_model: 'archon_mega_generator_v2',
        weight: 0.95
      }
    ], { onConflict: 'question' });

  if (error) {
    statusBox.style.color = 'var(--danger)';
    statusBox.textContent = 'خطأ في الحفظ: ' + error.message;
  } else {
    successCount++;
    statusBox.style.color = 'var(--ok)';
    statusBox.textContent = 'تم إرسال المعرفة بنجاح! التحديث القادم بعد 30 ثانية... ⏱️';
    statsBox.textContent = `تم إرسال: ${successCount} معلومة في هذه الجلسة`;
    currentIndex++;
  }
}

runAutoLoop();
setInterval(runAutoLoop, 300);
