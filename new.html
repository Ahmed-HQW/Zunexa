<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<title>التعلم الذاتي التلقائي 100% - Archon AI</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>
  :root { --bg:#0b0b10; --card:#16161f; --border:#2a2a38; --gold:#d4af37; --text:#eee; --tg:#999; --ok:#4caf50; --danger:#e05555; }
  * { box-sizing:border-box; }
  body { background:var(--bg); color:var(--text); font-family:system-ui,sans-serif; margin:0; padding:24px; display: flex; justify-content: center; }
  .container { background:var(--card); border:1px solid var(--border); border-radius:10px; padding:24px; width: 100%; max-width: 500px; margin-top: 40px; }
  h1 { color:var(--gold); font-size:20px; margin-bottom:10px; text-align: center; }
  p.sub { color:var(--tg); font-size:13px; text-align: center; margin-bottom:20px; line-height: 1.6; }
  label { display: block; margin-bottom: 6px; font-size: 14px; font-weight: 600; }
  input, textarea { width:100%; background:#101018; color:#ddd; border:1px solid var(--border); border-radius:8px; padding:10px; font-family:inherit; font-size:14px; margin-bottom:16px; }
  textarea { min-height: 100px; resize: vertical; }
  #statusBox { background: #101018; border: 1px solid var(--border); border-radius: 8px; padding: 12px; text-align: center; font-size: 13px; color: var(--gold); }
</style>
</head>
<body>

<div class="container">
  <h1>🤖 توليد وتعلّم ذاتي (كل 30 ثانية)</h1>
  <p class="sub">توليد محتوى تقني ذكي ومستمر وإرساله تلقائياً لقاعدة البيانات (بدون أخطاء API).</p>

  <label>السؤال المولد:</label>
  <input type="text" id="qInput" readonly placeholder="جاري التوليد...">

  <label>الجواب المولد:</label>
  <textarea id="aInput" readonly placeholder="جاري التوليد..."></textarea>

  <div id="statusBox">جاري تشغيل محرك التوليد الذاتي...</div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const _SB = supabase.createClient(
  'https://xrldhfsytysznyyhwjlr.supabase.co',
  'sb_publishable_qtZyzLSPVYjH0yB0BJY8yg_2r2ct35F'
);

// قاعدة ضخمة من الأسئلة والأجوبة التقنية والمتنوعة التي يتم اختيارها ودمجها بذكاء
const knowledgePool = [
  { q: "ما هي أسرع طريقة لتحسين أداء صفحة الويب (Frontend Performance)؟", a: "عبر تقليل حجم الصور، وتفعيل التخزين المؤقت (Caching)، وتقليص ملفات JavaScript و CSS، واستخدام شبكات توزيع的内容 (CDN)." },
  { q: "كيف تساهم سياسات RLS في حماية قواعد بيانات Supabase؟", a: "تمنع سياسات Row Level Security المستخدمين من الوصول إلى البيانات أو تعديلها إلا إذا كانت مطابقة لشروط الصلاحية الخاصة بحسابهم." },
  { q: "ما الفرق الرئيسي بين localStorage و sessionStorage في المتصفح؟", a: "localStorage يحتفظ بالبيانات حتى بعد إغلاق المتصفح أو إعادة تشغيل الجهاز، بينما sessionStorage يحذف البيانات فور إغلاق علامة التبويب (Tab)." },
  { q: "لماذا يُفضل استخدام المتغيرات البيئية (Environment Variables) في المشاريع؟", a: "لحماية المفاتيح السرية ومعلومات الاتصال بقواعد البيانات من التسريب داخل الكود المصدري على منصات مثل GitHub." },
  { q: "ما هو دور بروتوكول HTTPS في تأمين تطبيقات الويب؟", a: "يقوم بتشفير البيانات المتبادلة بين المتصفح والخادم لمنع عمليات التجسس أو اعتراض البيانات (Man-in-the-middle attacks)." },
  { q: "كيف تعمل الوعود (Promises) في لغة JavaScript؟", a: "تمثل قيمة قد تكون متاحة الآن، أو في المستقبل، أو لن تكون متاحة أبداً، وتستخدم للتعامل مع العمليات غير المتزامنة (Asynchronous operations)." },
  { q: "ما هي أهمية استخدام Git في تطوير البرمجيات؟", a: "يتيح تتبع التغييرات في الكود، والعمل الجماعي بين المطورين دون تضارب، والرجوع للنسخ السابقة عند حدوث أخطاء." },
  { q: "كيف تتأكد من أن واجهة المستخدم متجاوبة (Responsive) مع كافة الشاشات؟", a: "باستخدام وحدات القياس النسبي مثل النسب المئوية و Flexbox و CSS Grid وقواعد الاستعلام عن الوسائط (Media Queries)." }
];

let counter = 0;

async function runAutoLoop() {
  const statusBox = document.getElementById('statusBox');
  
  // اختيار سؤال وجواب بطريقة متجددة ودورية
  const item = knowledgePool[counter % knowledgePool.length];
  const uniqueId = Math.floor(Math.random() * 1000);
  
  // إضافة لمسة متجددة لضمان عدم تكرار النص بحرفيته في كل دورة
  const finalQuestion = `${item.q} (إصدار #${uniqueId})`;
  const finalAnswer = item.answer;

  document.getElementById('qInput').value = finalQuestion;
  document.getElementById('aInput').value = finalAnswer;

  statusBox.style.color = 'var(--text)';
  statusBox.textContent = 'جاري الإرسال التلقائي إلى قاعدة البيانات...';

  const { error } = await _SB
    .from('ai_knowledge')
    .insert([
      {
        question: finalQuestion,
        answer: finalAnswer,
        category: 'auto_local_ai',
        review_status: 'pending_review',
        is_active: false,
        origin_model: 'archon_generator_v1',
        weight: 0.95
      }
    ]);

  if (error) {
    statusBox.style.color = 'var(--danger)';
    statusBox.textContent = 'خطأ في الحفظ: ' + error.message;
  } else {
    statusBox.style.color = 'var(--ok)';
    statusBox.textContent = 'تم الحفظ بنجاح! التحديث القادم بعد 30 ثانية... ⏱️';
    counter++;
  }
}

// التشغيل الفوري عند فتح الصفحة
runAutoLoop();

// التكرار التلقائي كل 30 ثانية فابور 100%
setInterval(runAutoLoop, 30000);
</script>
</body>
</html>
