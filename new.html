<style>
  :root { --bg:#0b0b10; --card:#16161f; --border:#2a2a38; --gold:#d4af37; --text:#eee; --tg:#999; --ok:#4caf50; --danger:#e05555; }
  * { box-sizing:border-box; }
  body { background:var(--bg); color:var(--text); font-family:system-ui,sans-serif; margin:0; padding:24px; display: flex; justify-content: center; }
  .container { background:var(--card); border:1px solid var(--border); border-radius:10px; padding:24px; width: 100%; max-width: 550px; margin-top: 20px; }

  p.sub { color:var(--tg); font-size:12px; text-align: center; margin-bottom:20px; line-height: 1.6; }
  label { display: block; margin-bottom: 6px; font-size: 13px; font-weight: 600; color: var(--gold); }
  input, textarea { width:100%; background:#101018; color:#ddd; border:1px solid var(--border); border-radius:8px; padding:10px; font-family:inherit; font-size:13px; margin-bottom:14px; }
  textarea { min-height: 90px; resize: vertical; }
  #statusBox { background: #101018; border: 1px solid var(--border); border-radius: 8px; padding: 12px; text-align: center; font-size: 13px; color: var(--gold); }

</div>

  { q: "ما هو مفهوم التضخم الاقتصادي؟", a: "هو الارتفاع المستمر في المستوى العام للأسعار وانخفاض القوة الشرائية للعملة.", cat: "economy" },
  { q: "لماذا يُعد الاستثمار طويل الأجل ناجحاً؟", a: "لأنه يقلل من مخاطر التقلبات القصيرة ويستفيد من الفائدة المركبة بمرور الوقت.", cat: "economy" },
  
  // 11. علم النفس (Psychology)
  { q: "ما هو تأثير الاستمرارية في بناء العادات؟", a: "الاستمرارية اليومية ولو بخطوات صغيرة تبني مسارات عصبية ترسخ العادة بعمق في الدماغ.", cat: "psychology" },
  { q: "كيف تؤثر الإيجابية على الإنتاجية؟", a: "تقلل مستويات التوتر وتزيد من التركيز والقدرة على الابتكار.", cat: "psychology" },
  
  // 12. الفضاء والفلك (Space)
  { q: "ما هي مجرة درب التبانة؟", a: "هي المجرة التي تضم نظامنا الشمسي وتحتوي على مليارات النجوم.", cat: "space" },
  { q: "ما هو الثقب الأسود؟", a: "هو منطقة في الفضاء ذات جاذبية هائلة لا يمكن حتى للضوء الافلات منها.", cat: "space" },
  
  // 13. صحة وتغذية (Health)
  { q: "لماذا يعتبر شرب الماء بكميات كافية ضرورياً؟", a: "لأنه يدعم وظائف الأعضاء، يحسن التركيز، ويحافظ على حيوية الخلايا.", cat: "health" },
  { q: "ما هي فوائد النوم العميق للجسم؟", a: "يساعد في إصلاح الأنسجة، تعزيز المناعة، وترسيخ الذاكرة.", cat: "health" },
  
  // 14. فن وموسيقى (Arts)
  { q: "ما هو دور الفن في المجتمع؟", a: "يعكس ثقافة الشعوب، يعبر عن المشاعر الإنسانية، ويلهم الابتكار.", cat: "arts" },

  { q: "ما أهمية السينما في العصر الحديث؟", a: "تعد وسيلة قوية لسرد القصص، نقل الثقافات، وتوثيق التاريخ الإنساني.", cat: "cinema" },

  { q: "ما هو السر خلف كل نجاح مستدام؟", a: "الانضباط المستمر والتعلم من الأخطاء وعدم الاستسلام أمام الصعاب.", cat: "motivation" },

  // 23. تعليم ودراسة (Education)
  { q: "ما هي أفضل طريقة لترسيخ المعلومات الجديدة؟", a: "التكرار المتباعد والفهم العملي وتطبيق المعرفة مباشرة.", cat: "education" },

let currentIndex = 0;
let successCount = 0;

async function runAutoLoop() {
  const statusBox = document.getElementById('statusBox');
  const statsBox = document.getElementById('counterStats');
  
  // اختيار العنصر بشكل ددوري متجدد
  const item = knowledgePool[currentIndex % knowledgePool.length];
  const uniqueId = Math.floor(Math.random() * 9000) + 1000;
  
  // دمج قوالب متغيرة لزيادة التنوع (Templates & Variations)
  const finalQuestion = `${item.q} [مرجع #${uniqueId}]`;
  const finalAnswer = `${item.a} (تمت المراجعة والتوليد التلقائي لنظام Archon AI بنجاح - إصدار ${uniqueId})`.trim();
  const finalCategory = item.cat || "general_mixed";

  // تعبئة الواجهة أمامك
  document.getElementById('qInput').value = finalQuestion;
  document.getElementById('aInput').value = finalAnswer;
  document.getElementById('catInput').value = finalCategory;

  statusBox.style.color = 'var(--text)';
  statusBox.textContent = 'جاري إرسال المدخل المعرفي إلى قاعدة البيانات...';

  // الإرسال التلقائي إلى Supabase
  const { error } = await _SB
    .from('ai_knowledge')
    .insert([
      {
        question: finalQuestion,
        answer: finalAnswer,
        category: finalCategory,
        review_status: 'pending_review',
        is_active: false,
        origin_model: 'archon_mega_generator_v2',
        weight: 0.95
      }
    ]);

  if (error) {
    statusBox.style.color = 'var(--danger)';
    statusBox.textContent = 'خطأ في الحفظ: ' + error.message;
  } else {
    successCount++;
    statusBox.style.color = 'var(--ok)';
    statusBox.textContent = 'تم إرسال المعرفة بنجاح! التحديث القادم بعد 3 ثانية... ⏱️';
    statsBox.textContent = `تم إرسال: ${successCount} معلومة في هذه الجلسة`;
    currentIndex++;
  }
}

// التشغيل الفوري عند فتح الصفحة
runAutoLoop();

// التكرار التلقائي كل 30 ثانية فابور 100%
setInterval(runAutoLoop, 300);
</script>
</body>
</html>
