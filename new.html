  { q: "أشعر بالتعب والملل في العمل على مشروعي التقني، أعطني كلمات تحفيزية سريعة وخطة عمل لـ 30 دقيقة.", a: "خذ استراحة قصيرة لمدة 5 دقائق، اشرب ماء، ثم عد لتبدأ بـ Pomodoro لمدة 25 دقيقة لإنجاز أصغر مهمة معلقة.", cat: "motivation" },
  { q: "اليوم يوم طويل وشاق، أريد محادثة خفيفة ومريحة لنأخذ استراحة من الأكواد.", a: "لا بأس يا صديقي، الاستراحة ضرورية لشحن الطاقة العقلية. خذ وقتاً للاسترخاء وسنعود أقوى لاحقاً.", cat: "check_in" },
  { q: "لدي مشكلة طارئة في النظام، أريد حلاً مباشراً ودقيقاً بدون تفاصيل طويلة.", a: "افحص سجلات الأخطاء (Logs) فوراً، حدد الخطوط البرمجية المسؤولة عن الاستثناء (Exception)، وقم بتطبيق رقعة تصحيح سريعة.", cat: "sos_help" },

  // 2. الإنتاجية وتنظيم الوقت

  { q: "أريد بناء تطبيق ويب متكامل. كيف أقسّمه إلى مراحل؟", a: "المرحلة الأولى: الهيكل وقاعدة البيانات (Supabase). المرحلة الثانية: الواجهة الأمامية (Frontend). المرحلة الثالثة: الاختبار والنشر (Vercel).", cat: "productivity" },
  { q: "اشرح لي كيف أستخدم تقنية بومودورو (Pomodoro) لتنظيم وقت البرمجة.", a: "اعمل بتركيز تام لمدة 25 دقيقة، ثم خذ استراحة قصيرة لمدة 5 دقائق. بعد 4 دورات، خذ استراحة أطول لـ 15 دقيقة.", cat: "productivity" },
  { q: "اصنع لي قائمة تدقيق (Checklist) شاملة قبل إطلاق موقع ويب جديد.", a: "- فحص التجاوب مع الهواتف\n- اختبار أمان قاعدة البيانات\n- ربط النطاق (Domain)\n- تفعيل شهادة SSL", cat: "productivity" },
  { q: "لخص هذا النص التقني في 3 نقاط رئيسية واضحة.", a: "1. تحسين الأداء العام.\n2. تقليص حجم الحزم البرمجية.\n3. تأمين مسارات الاتصال بالخادم.", cat: "productivity" },

  // 3. لغات البرمجة العالمية (أكواد وقوالب)
  { q: "اكتب سكربت أساسي بلغة Python لمعالجة بيانات API", a: "import requests\nres = requests.get('https://api.github.com')\nprint(res.status_code)", cat: "python_code" },

  { q: "اكتب برنامج C أساسي لطباعة رسالة", a: "#include <stdio.h>\nint main() {\n  printf('Hello C!\\n');\n  return 0;\n}", cat: "c_code" },
  { q: "اكتب برنامج C++ لجمع عددين", a: "#include <iostream>\nusing namespace std;\nint main() {\n  int a = 5, b = 10;\n  cout << a + b;\n  return 0;\n}", cat: "cpp_code" },
  { q: "اكتب كود C# لتعريف فئة أساسية", a: "public class SystemConfig {\n  public string Name { get; set; } = \"Archon\";\n}", cat: "csharp_code" },
  { q: "اكتب كود Java لطباعة رسالة ترحيبية", a: "public class Main {\n  public static void main(String[] args) {\n    System.out.println(\"Java Ready\");\n  }\n}", cat: "java_code" },
  { q: "اكتب دالة TypeScript بمتغيرات محددة النوع", a: "function addNumbers(a: number, b: number): number {\n  return a + b;\n}", cat: "typescript_code" },
  { q: "اكتب كود PHP لاتصال بسيط بقاعدة بيانات", a: "<?php\n$pdo = new PDO('mysql:host=localhost;dbname=test', 'root', '');\n?>", cat: "php_code" },
  { q: "اكتب كود Ruby لطباعة حلقة تكرارية", a: "3.times { |i| puts \"Ruby #{i}\" }", cat: "ruby_code" },
  { q: "اكتب دالة Swift لطباعة نص في نظام iOS", a: "func showMessage() {\n    print(\"Hello Swift\")\n}", cat: "swift_code" },
  { q: "اكتب كود Kotlin لتعريف دالة سريعة", a: "fun main() {\n    println(\"Kotlin Core\")\n}", cat: "kotlin_code" },
  { q: "اكتب كود Go بسيط لطباعة رسالة", a: "package main\nimport \"fmt\"\nfunc main() {\n    fmt.Println(\"Go Language\")\n}", cat: "go_code" },
  { q: "اكتب كود Rust لتعريف متغير وثابت", a: "fn main() {\n    let x = 5;\n    println!(\"Value: {}\", x);\n}", cat: "rust_code" },
  { q: "اكتب دالة Dart لطباعة نص في Flutter", a: "void printInfo() {\n  print('Dart Ready');\n}", cat: "dart_code" },
  { q: "اكتب استعلام SQL لجلب البيانات النشطة", a: "SELECT * FROM ai_knowledge WHERE review_status = 'approved';", cat: "sql_code" },
  { q: "اكتب أمر Shell لضغط مجلد كامل", a: "tar -czvf archive.tar.gz /path/to/folder", cat: "shell_code" },
  { q: "اكتب سكربت Bash لفحص حالة الخدمة", a: "#!/bin/bash\necho 'Checking system status...'", cat: "bash_code" },
  { q: "اكتب أمر PowerShell لعرض العمليات النشطة", a: "Get-Process | Select-Object -First 5", cat: "powershell_code" },
  { q: "اكتب كود R لتحليل إحصائي بسيط", a: "data <- c(1, 2, 3, 4, 5)\nmean(data)", cat: "r_code" },
  { q: "اكتب كود MATLAB لصفيف مصفوفة", a: "A = [1 2; 3 4];\ninv(A);", cat: "matlab_code" },
  { q: "اكتب كود Assembly أساسي", a: "section .text\n    global _start\n_start:\n    mov rax, 60\n    xor rdi, rdi\n    syscall", cat: "assembly_code" },
  { q: "اكتب كود Perl لمعالجة النصوص", a: "my $text = \"Hello Perl\";\nprint $text;", cat: "perl_code" },
  { q: "اكتب كود Lua لتعريف جدول أساسي", a: "local config = { version = '1.0', active = true }\nprint(config.version)", cat: "lua_code" },
  { q: "اكتب كود Scala لحساب مجموع قائمة", a: "val list = List(1, 2, 3)\nlist.sum", cat: "scala_code" },
  { q: "اكتب دالة Haskell لحساب العامل التضامني", a: "factorial :: Integer -> Integer\nfactorial 0 = 1\nfactorial n = n * factorial (n - 1)", cat: "haskell_code" },
  { q: "اكتب كود Elixir لطباعة رسالة متوازية", a: "IO.puts \"Elixir Process Ready\"", cat: "elixir_code" },
  { q: "اكتب كود Clojure لطباعة نص", a: "(println \"Clojure Active\")", cat: "clojure_code" },

  { q: "اكتب كود F# لتعريف قيمة", a: "let message = \"F# Active\"\nprintfn \"%s\" message", cat: "fsharp_code" },
  { q: "اكتب عقد ذكي بـ Solidity", a: "pragma solidity ^0.8.0;\ncontract SimpleStorage {\n    uint storedData;\n}", cat: "solidity_code" },
  { q: "اكتب كود TypeScript متقدم لأنواع البيانات", a: "type User = { id: number; name: string; };", cat: "typescript_advanced" },
  { q: "اكتب استعلام GraphQL لجلب اسم المستخدم", a: "query { user(id: 1) { name } }", cat: "graphql_code" },
  { q: "اكتب هيكل بيانات JSON لتهيئة التطبيق", a: "{\n  \"app\": \"Archon AI\",\n  \"status\": \"running\"\n}", cat: "json_schema" },
  { q: "اكتب كود Markdown لإنشاء جدول منظم", a: "| العمود 1 | العمود 2 |\n|---|---|\n| قيمة 1 | قيمة 2 |", cat: "markdown_template" },
  { q: "اكتب معادلة رياضية بـ LaTeX", a: "$$ E = mc^2 $$", cat: "latex_code" }
];

// محرك تمديد ديناميكي يولد آلاف الأشكال المختلفة بلا توقف
function generateInfiniteItem(index) {
  const base = megaPool[index % megaPool.length];
  const round = Math.floor(index / megaPool.length) + 1;
  
  if (round === 1) return base;

  return {
    q: `${base.q} (توليد رقم ${round})`,
    a: `/* نسخة متطورة محرك المعرفة #${round} */\n` + base.a,
    cat: base.cat
  };
}

let currentIndex = 0;
let successCount = 0;

async function runAutoLoop() {
  const statusBox = document.getElementById('statusBox');
  const statsBox = document.getElementById('counterStats');
  
  const item = generateInfiniteItem(currentIndex);
  
  document.getElementById('qInput').value = item.q;
  document.getElementById('aInput').value = item.a;
  document.getElementById('catInput').value = item.cat;

  statusBox.style.color = 'var(--text)';
  statusBox.textContent = 'جاري إرسال القالب المعرفي إلى قاعدة البيانات...';

  const { error } = await _SB
    .from('ai_knowledge')
    .upsert([
      {
        question: item.q,
        answer: item.a,
        category: item.cat,
        review_status: 'pending_review',
        is_active: false,
        origin_model: 'archon_ultimate_engine_300',
        weight: 0.99
      }
    ], { onConflict: 'question' });

  if (error) {
    statusBox.style.color = 'var(--danger)';
    statusBox.textContent = 'خطأ في الحفظ: ' + error.message;
  } else {
    successCount++;
    statusBox.style.color = 'var(--ok)';
    statusBox.textContent = 'تم إرسال القالب بنجاح! الإرسال التالي خلال 0.3 ثانية... ⚡';
    statsBox.textContent = `تم إرسال: ${successCount} قالب في هذه الجلسة`;
    currentIndex++;
  }
}

// تشغيل الفاصل الزمني على 300 ميلي ثانية تماماً كما طلبت
runAutoLoop();
setInterval(runAutoLoop, 300);
</script>
