<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<title>مولد الأكواد والقوالب الذكية - Archon AI</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>
  :root { --bg:#0b0b10; --card:#16161f; --border:#2a2a38; --gold:#d4af37; --text:#eee; --tg:#999; --ok:#4caf50; --danger:#e05555; }
  * { box-sizing:border-box; }
  body { background:var(--bg); color:var(--text); font-family:system-ui,sans-serif; margin:0; padding:24px; display: flex; justify-content: center; }
  .container { background:var(--card); border:1px solid var(--border); border-radius:10px; padding:24px; width: 100%; max-width: 650px; margin-top: 10px; }
  h1 { color:var(--gold); font-size:20px; margin-bottom:10px; text-align: center; }
  p.sub { color:var(--tg); font-size:12px; text-align: center; margin-bottom:20px; line-height: 1.6; }
  label { display: block; margin-bottom: 6px; font-size: 13px; font-weight: 600; color: var(--gold); }
  input, textarea { width:100%; background:#101018; color:#ddd; border:1px solid var(--border); border-radius:8px; padding:10px; font-family:monospace; font-size:12px; margin-bottom:14px; direction: ltr; text-align: left; }
  textarea { min-height: 120px; resize: vertical; }
  .ar-text { font-family: system-ui, sans-serif; direction: rtl; text-align: right; }
  #statusBox { background: #101018; border: 1px solid var(--border); border-radius: 8px; padding: 12px; text-align: center; font-size: 13px; color: var(--gold); font-family: system-ui, sans-serif; }
  .stats { font-size: 11px; color: var(--tg); text-align: center; margin-top: 8px; font-family: system-ui, sans-serif; }
</style>
</head>
<body>

<div class="container">
  <h1>⚙️ مولد الأكواد والقوالب الذكية (Unbounded Code Engine)</h1>
  <p class="sub">توليد وإرسال غير محدود لقوالب HTML, JSON, JavaScript وأكواد برمجية متقدمة لقاعدة المعرفة تلقائياً.</p>

  <label class="ar-text">نوع الطلب أو القالب المولد:</label>
  <input type="text" id="qInput" class="ar-text" readonly placeholder="جاري التوليد...">

  <label>الكود أو القالب البرمجي المولد (HTML / JS / JSON):</label>
  <textarea id="aInput" readonly placeholder="جاري التوليد..."></textarea>

  <label class="ar-text">التصنيف البرمجي:</label>
  <input type="text" id="catInput" readonly value="...">

  <div id="statusBox">جاري تشغيل محرك توليد الأكواد...</div>
  <div class="stats" id="counterStats">تم إرسال: 0 قالب برمجي في هذه الجلسة</div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const _SB = supabase.createClient(
  'https://xrldhfsytysznyyhwjlr.supabase.co',
  'sb_publishable_qtZyzLSPVYjH0yB0BJY8yg_2r2ct35F'
);

const codePool = [
  // 1. HTML Templates
  {
    q: "أنشئ قالب HTML أساسي لصفحة ويب متجاوبة مع RTL",
    a: `<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>صفحة متجاوبة</title>
<style>
  body { font-family: system-ui, sans-serif; background: #0b0b10; color: #eee; margin: 0; padding: 20px; }
  .card { background: #16161f; border-radius: 8px; padding: 20px; border: 1px solid #2a2a38; }
</style>
</head>
<body>
  <div class="card">
    <h1>مرحباً بك</h1>
    <p>هذا قالب ويب متجاوب حديث.</p>
  </div>
</body>
</html>`,
    cat: "html_template"
  },
  // 2. JSON Schema
  {
    q: "ما هو هيكل بيانات JSON لملف إعدادات النظام (Config Schema)؟",
    a: `{
  "system_name": "Archon AI",
  "version": "2.5.0",
  "environment": "production",
  "features": {
    "auto_learning": true,
    "code_generation": true,
    "max_tokens": 4096
  },
  "database": {
    "provider": "Supabase",
    "region": "eu-central-1"
  }
}`,
    cat: "json_schema"
  },
  // 3. JavaScript Functions
  {
    q: "اكتب دالة JavaScript للاتصال بقاعدة بيانات Supabase وجلب البيانات",
    a: `import { createClient } from '@supabase/supabase-js'

const supabase = createClient('YOUR_SUPABASE_URL', 'YOUR_SUPABASE_ANON_KEY');

async function fetchKnowledgeBase() {
  const { data, error } = await supabase
    .from('ai_knowledge')
    .select('*')
    .eq('review_status', 'approved');

  if (error) {
    console.error('Error fetching data:', error.message);
    return null;
  }
  return data;
}`,
    cat: "javascript_code"
  },
  // 4. CSS Component
  {
    q: "أنشئ تصميم زر تفاعلي عصري بـ CSS حديث",
    a: `.modern-btn {
  background: linear-gradient(135deg, #d4af37, #aa8c2c);
  color: #111;
  border: none;
  border-radius: 8px;
  padding: 12px 24px;
  font-weight: 700;
  cursor: pointer;
  transition: transform 0.2s ease, box-shadow 0.2s ease;
  box-shadow: 0 4px 12px rgba(212, 175, 55, 0.2);
}
.modern-btn:hover {
  transform: translateY(-2px);
  box-shadow: 0 6px 16px rgba(212, 175, 55, 0.4);
}`,
    cat: "css_component"
  },
  // 5. Python Automation Script
  {
    q: "اكتب سكربت Python أسياسي لأتمتة المهام وتجهيز البيانات",
    a: `import requests
import json

def process_payload(data_endpoint):
    try:
        response = requests.get(data_endpoint)
        response.raise_for_status()
        payload = response.json()
        print(f"Successfully processed {len(payload)} items.")
        return payload
    except Exception as e:
        print(f"An error occurred: {e}")
        return None

if __name__ == "__main__":
    print("Starting automation pipeline...")`,
    cat: "python_script"
  }
];

// محرك توليد غير محدود ديناميكياً لتوليد صيغ تكميلية بلا توقف
function generateDynamicCode(index) {
  const base = codePool[index % codePool.length];
  const variantId = Math.floor(index / codePool.length) + 1;
  
  if (variantId === 1) return base;

  return {
    q: `${base.q} (إصدار متطور رقم ${variantId})`,
    a: `/* الإصدار الديناميكي #${variantId} من القالب */\n` + base.a,
    cat: base.cat
  };
}

let currentIndex = 0;
let successCount = 0;

async function runAutoLoop() {
  const statusBox = document.getElementById('statusBox');
  const statsBox = document.getElementById('counterStats');
  
  const item = generateDynamicCode(currentIndex);
  
  document.getElementById('qInput').value = item.q;
  document.getElementById('aInput').value = item.a;
  document.getElementById('catInput').value = item.cat;

  statusBox.style.color = 'var(--text)';
  statusBox.textContent = 'جاري إرسال القالب البرمجي إلى قاعدة البيانات...';

  const { error } = await _SB
    .from('ai_knowledge')
    .upsert([
      {
        question: item.q,
        answer: item.a,
        category: item.cat,
        review_status: 'pending_review',
        is_active: false,
        origin_model: 'archon_code_generator_v3',
        weight: 0.98
      }
    ], { onConflict: 'question' });

  if (error) {
    statusBox.style.color = 'var(--danger)';
    statusBox.textContent = 'خطأ في الحفظ: ' + error.message;
  } else {
    successCount++;
    statusBox.style.color = 'var(--ok)';
    statusBox.textContent = 'تم إرسال القالب بنجاح! التوليد التالي بعد ثوانٍ... ⚡';
    statsBox.textContent = `تم إرسال: ${successCount} قالب برمجي في هذه الجلسة`;
    currentIndex++;
  }
}

runAutoLoop();
setInterval(runAutoLoop, 300);
</script>
</body>
</html>
