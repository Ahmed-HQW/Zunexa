<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<title>التعلم الذاتي التلقائي 100% - Archon AI</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>
  :root { --bg:#0b0b10; --card:#16161f; --border:#2a2a38; --gold:#d4af37; --text:#eee; --tg:#999; --ok:#4caf50; --danger:#e05555; }
  * { box-sizing:border-box; }
  body { background:var(--bg); color:var(--text); font-family:system-ui,sans-serif; margin:0; padding:24px; display: flex; justify-content: center; }
  .container { background:var(--card); border:1px solid var(--border); border-radius:10px; padding:24px; width: 100%; max-width: 500px; margin-top: 40px; }
  h1 { color:var(--gold); font-size:20px; margin-bottom:10px; text-align: center; }
  p.sub { color:var(--tg); font-size:13px; text-align: center; margin-bottom:20px; line-height: 1.6; }
  label { display: block; margin-bottom: 6px; font-size: 14px; font-weight: 600; }
  input, textarea { width:100%; background:#101018; color:#ddd; border:1px solid var(--border); border-radius:8px; padding:10px; font-family:inherit; font-size:14px; margin-bottom:16px; }
  textarea { min-height: 100px; resize: vertical; }
  #statusBox { background: #101018; border: 1px solid var(--border); border-radius: 8px; padding: 12px; text-align: center; font-size: 13px; color: var(--gold); }
</style>
</head>
<body>

<div class="container">
  <h1>🤖 توليد وتعلّم ذاتي (كل 30 ثانية)</h1>
  <p class="sub">الصفحة تتصل بـ Pollinations AI لتوليد المعرفة تلقائياً وإرسالها إلى قاعدة البيانات بدون أي تدخل بشري.</p>

  <label>السؤال المولد تلقائياً:</label>
  <input type="text" id="qInput" readonly placeholder="جاري التوليد...">

  <label>الجواب المولد تلقائياً:</label>
  <textarea id="aInput" readonly placeholder="جاري التوليد..."></textarea>

  <div id="statusBox">جاري الاتصال بالذكاء الاصطناعي...</div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
// إعدادات Supabase
const _SB = supabase.createClient(
  'https://xrldhfsytysznyyhwjlr.supabase.co',
  'sb_publishable_qtZyzLSPVYjH0yB0BJY8yg_2r2ct35F'
);

// مواضيع مختلفة لضمان تنوع الأسئلة في كل دورة
const topics = [
  "تقنيات الويب الحديثة وتطوير الواجهات",
  "أساسيات قواعد البيانات وعلاقتها بـ PostgreSQL",
  "أهمية الذكاء الاصطناعي في أتمتة المهام البرمجية",
  "مفاهيم الأمن السيبراني وحماية التطبيقات",
  "تحسين أداء وتجربة المستخدم في تطبيقات السحاب"
];

let topicIndex = 0;

async function runAutoLoop() {
  const statusBox = document.getElementById('statusBox');
  const currentTopic = topics[topicIndex];
  topicIndex = (topicIndex + 1) % topics.length;

  statusBox.style.color = 'var(--text)';
  statusBox.textContent = 'جاري توليد محتوى جديد عبر الذكاء الاصطناعي...';

  try {
    // 1. طلب توليد سؤال وجواب من Pollinations AI مجاناً
    const prompt = `اعطني سؤالاً تقنياً وجوابه المفصل باللغة العربية حول موضوع: "${currentTopic}". اجعل النتيجة بصيغة JSON على الشكل التالي فقط دون أي كلام زائد: {"question": "...", "answer": "..."}`;
    
    const aiRes = await fetch(`https://text.pollinations.ai/${encodeURIComponent(prompt)}`);
    const aiText = await aiRes.text();

    // استخراج JSON من رد الذكاء الاصطناعي
    let parsedData;
    try {
      // محاولة البحث عن كود الـ JSON داخل الرد
      const jsonMatch = aiText.match(/\{[\s\S]*\}/);
      parsedData = JSON.parse(jsonMatch ? jsonMatch[0] : aiText);
    } catch (parseErr) {
      // كحل بديل إذا لم يرجع JSON مضبوطاً، نأخذ النص كاملاً كجواب
      parsedData = {
        question: `سؤال تلقائي حول: ${currentTopic}`,
        answer: aiText
      };
    }

    // عرض المحتوى في الواجهة أمامك
    document.getElementById('qInput').value = parsedData.question;
    document.getElementById('aInput').value = parsedData.answer;

    statusBox.textContent = 'جاري الإرسال إلى قاعدة البيانات...';

    // 2. الإرسال التلقائي إلى Supabase بوضعية pending_review
    const { error } = await _SB
      .from('ai_knowledge')
      .insert([
        {
          question: parsedData.question,
          answer: parsedData.answer,
          category: 'pollinations_ai',
          review_status: 'pending_review',
          is_active: false,
          origin_model: 'pollinations.ai',
          weight: 0.9
        }
      ]);

    if (error) {
      statusBox.style.color = 'var(--danger)';
      statusBox.textContent = 'خطأ في حفظ القاعدة: ' + error.message;
    } else {
      statusBox.style.color = 'var(--ok)';
      statusBox.textContent = 'تم التوليد والحفظ بنجاح! التحديث القادم بعد 30 ثانية... ⏱️';
    }

  } catch (err) {
    statusBox.style.color = 'var(--danger)';
    statusBox.textContent = 'خطأ في الاتصال: ' + err.message;
  }
}

// تشغيل الدالة فور فتح الصفحة
runAutoLoop();

// تكرار العملية تلقائياً كل 30 ثانية
setInterval(runAutoLoop, 30);
</script>
</body>
</html>
