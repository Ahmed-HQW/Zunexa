<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Zunexa SaaS — Feedback</title> <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='8' fill='%23080808'/><rect x='1' y='1' width='30' height='30' rx='7' fill='none' stroke='%23D4AF37' stroke-width='.8' opacity='.6'/><text x='16' y='21' text-anchor='middle' font-size='17' font-family='Georgia,serif' fill='%23D4AF37' font-weight='bold'>Z</text></svg>">
<link rel="stylesheet" href="style.css">
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700&family=Rajdhani:wght@300;400;500;600;700&family=Amiri:wght@400;700&display=swap" rel="stylesheet" />
<!-- ═══ PAGE: FEEDBACK ══════════════════════════════════════════ -->
<section class="page" id="page-feedback">
  <div class="page-heading">💬 Feedback</div>
  <div class="page-sub mb-3">شاركنا رأيك — Help us improve Zunexa.</div>
 
  <div class="card mb-3">
    <div class="section-title mt-0">Rate Your Experience</div>
    <div class="feedback-stars" id="feedbackStars">
      <button class="star-btn" onclick="setRating(1)">⭐</button>
      <button class="star-btn" onclick="setRating(2)">⭐</button>
      <button class="star-btn" onclick="setRating(3)">⭐</button>
      <button class="star-btn" onclick="setRating(4)">⭐</button>
      <button class="star-btn" onclick="setRating(5)">⭐</button>
    </div>
    <div style="font-size:12px;color:var(--text-muted)" id="ratingLabel">Click a star to rate</div>
  </div>
 
  <div class="card mb-3">
    <div class="section-title mt-0">Feedback Type</div>
    <div class="feedback-types">
      <button class="feedback-type-btn active" onclick="selectFeedbackType(this,'Bug Report')">🐛 Bug Report</button>
      <button class="feedback-type-btn" onclick="selectFeedbackType(this,'Feature Request')">💡 Feature Request</button>
      <button class="feedback-type-btn" onclick="selectFeedbackType(this,'Compliment')">🙌 Compliment</button>
      <button class="feedback-type-btn" onclick="selectFeedbackType(this,'Other')">📝 Other</button>
    </div>
  </div>
 
  <div class="card mb-3">
    <div class="section-title mt-0">Your Message</div>
    <div class="form-field" style="margin-top:8px">
      <input type="text" id="feedbackSubject" placeholder="Subject / عنوان" style="margin-bottom:10px"/>
      <textarea id="feedbackMsg" rows="5" placeholder="Describe your feedback in detail... اكتب ملاحظاتك بالتفصيل..." style="width:100%;background:var(--bg-input);border:1px solid var(--border);border-radius:var(--radius-md);padding:12px;color:var(--text-white);font-family:'Rajdhani',sans-serif;font-size:14px;resize:vertical;outline:none;transition:border-color var(--trans)"></textarea>
    </div>
    <button class="btn btn-gold" style="margin-top:12px" onclick="submitFeedback()">✦ Send Feedback</button>
  </div>
  <footer class="app-footer">Zunexa SaaS — <span id="zx-footer-user">Zunexa Digital Brand</span></footer>
</section>
